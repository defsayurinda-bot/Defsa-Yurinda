name: Verifikasi

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifikasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Periksa situs sudah dibangun ulang dari konten/
        run: |
          pip install -r skrip/kebutuhan.txt
          python3 skrip/bangun_situs.py --periksa
      - name: Jalankan semua verifikasi
        run: |
          for f in tests/verifikasi_*.py; do
            echo "== $f"
            python3 "$f" || exit 1
          done
