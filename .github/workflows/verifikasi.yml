name: Verifikasi

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifikasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang kebutuhan Python
        run: pip install -r skrip/kebutuhan.txt
      # Di main, docs/ dibangun ulang oleh workflow "Bangun situs"; pemeriksaan ini untuk Pull Request.
      - name: Periksa situs sudah dibangun ulang dari konten/
        if: github.event_name == 'pull_request'
        run: |
          python3 skrip/bangun_situs.py --periksa
      - name: Jalankan semua verifikasi
        run: |
          for f in tests/verifikasi_*.py; do
            echo "== $f"
            python3 "$f" || exit 1
          done
