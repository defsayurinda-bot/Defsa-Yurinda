name: Verifikasi hitungan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifikasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bandingkan hitungan JavaScript dengan Python dan nilai tabel
        run: |
          for f in tests/verifikasi_*.py; do
            echo "== $f"
            python3 "$f"
          done
